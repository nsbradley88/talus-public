[package]
name = "talus-setup"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Guided install, health checks (doctor) and updates for Talus; installed as the `talus` command"

[[bin]]
name = "talus-setup"
path = "src/main.rs"

[dependencies]
talus-presets = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
libc = "0.2"
