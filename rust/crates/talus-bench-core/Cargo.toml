[package]
name = "talus-bench-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "talus-bench core: paired quality validation (config, datasets, scorers, pairing, statistics, gates, reports) over talus-server's HTTP API"

[dependencies]
talus-presets = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
yaml_serde = "0.10"
regex = "1"
